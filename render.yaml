services:
  # Combined Service (Web type - runs both the bot and web dashboard)
  - type: web
    name: usa-army-application
    env: python
    buildCommand: bash render_build.sh
    startCommand: gunicorn wsgi:app --bind=0.0.0.0:$PORT --log-level info --access-logfile - --error-logfile -
    plan: starter
    envVars:
      - key: DISCORD_BOT_TOKEN
        sync: false
      - key: ROBLOX_COOKIE
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: usa-army-bot-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: PORT
        value: 10000
      - key: RUN_BOT
        value: "true"
    healthCheckPath: /

# Database for the bot and web dashboard
databases:
  - name: usa-army-bot-db
    plan: starter
    databaseName: usa_army_bot
