services:
  # Discord Bot Service
  - type: worker
    name: usa-army-discord-bot
    env: python
    buildCommand: pip install -r requirements_for_render.txt
    startCommand: python main.py
    plan: starter
    envVars:
      - key: DISCORD_BOT_TOKEN
        sync: false
      - key: ROBLOX_COOKIE
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: usa-army-bot-db
          property: connectionString
      - key: WORKER_MODE
        value: "true"

  # Web Dashboard Service
  - type: web
    name: usa-army-dashboard
    env: python
    buildCommand: bash render_build.sh
    startCommand: gunicorn wsgi:app --bind=0.0.0.0:$PORT --log-level debug
    plan: starter
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: usa-army-bot-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: PORT
        value: 10000
      - key: WEB_SERVICE_MODE
        value: "dashboard"
      - key: PYTHON_VERSION
        value: "3.11.0"
    healthCheckPath: /

# Database for the bot and web dashboard
databases:
  - name: usa-army-bot-db
    plan: starter
    databaseName: usa_army_bot
